[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptune"
version = "0.1.1"
license = "MIT"
description = "MCP-based tool-use fine-tuning framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tomás Rodrigues"}]
keywords = ["mcp", "llm", "fine-tuning", "tool-use", "lora"]
urls = {Homepage = "https://github.com/TomasrRodrigues/mcptune", Repository = "https://github.com/TomasrRodrigues/mcptune"}

dependencies = [
    "fastmcp>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "uvicorn>=0.30",
    "httpx>=0.28",
]

transformers = [
    "transformers>=4.40,<5.0",
    "torch>=2.0",
    "peft>=0.10",
    "accelerate>=0.30",
    "datasets>=2.18",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mcptune.sampling" = ["prompts/*.txt"]
"mcptune.synthesis" = ["prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no IO, pure logic",
    "integration: cross-component, in-process MCP",
    "e2e: spawns external processes, slow, opt-in",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"tests/*"     = ["B011"]

[tool.coverage.run]
source = ["src/mcptune"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]